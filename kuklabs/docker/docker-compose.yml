services:
  kukdocs-engine:
    image: ${KUKDOCS_IMAGE:-officecli-kukdocs:local}
    build:
      context: ../..
      dockerfile: kuklabs/docker/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      KUKDOCS_WORK_ROOT: /data/work
      KUKDOCS_OUTPUT_ROOT: /data/output
      KUKDOCS_MAX_FILE_MB: ${KUKDOCS_MAX_FILE_MB:-50}
      KUKDOCS_RETENTION_HOURS: ${KUKDOCS_RETENTION_HOURS:-24}
    ports:
      - "8080:8080"
    volumes:
      - kukdocs-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  kukdocs-data:
