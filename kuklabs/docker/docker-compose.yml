services:
  kukdocs-engine:
    image: ${KUKDOCS_IMAGE:-kukdocs-engine:local}
    build:
      context: ../..
      dockerfile: kuklabs/api/Dockerfile
    environment:
      PORT: 8080
      KUKDOCS_WORK_ROOT: /data/jobs
      KUKDOCS_API_KEY: ${KUKDOCS_API_KEY:-change-me}
      OFFICECLI_TIMEOUT_MS: ${OFFICECLI_TIMEOUT_MS:-120000}
      OFFICECLI_SKIP_UPDATE: 1
    ports:
      - "8080:8080"
    volumes:
      - kukdocs-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  kukdocs-data:
