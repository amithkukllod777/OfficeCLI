name: KukDocs API CI

on:
  pull_request:
    paths:
      - 'kuklabs/api/**'
      - 'kuklabs/docker/**'
      - '.github/workflows/kukdocs-api-ci.yml'
  push:
    branches: [main]
    paths:
      - 'kuklabs/api/**'
      - 'kuklabs/docker/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuklabs/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kuklabs/api/package.json
      - run: npm install
      - run: npm run build
      - name: Build container
        working-directory: .
        run: docker build -f kuklabs/api/Dockerfile -t kukdocs-engine:ci .
